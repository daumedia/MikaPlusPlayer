name: MikaPlusPlayer

options:
  bundleIdPrefix: lu.daumedia
  # B09 · OF-01 (2026-10-01): Die App ist deutschsprachig (Entwicklungssprache de, Info.plist CFBundleLocalizations [de]),
  # damit Sparkle-Dialoge und System-Menüeinträge deutsch erscheinen – projektweit, auch für iOS.
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

# Hinweis zur Struktur: iOS und macOS sind ZWEI schlanke Targets, die sich
# DASSELBE Codebase (Sources/) teilen. Grund: Sparkle (Auto-Updater) ist
# macOS-only und lässt sich in einem einzelnen supportedDestinations-Target
# nicht sauber nur für macOS linken. Beide Targets erzeugen "MikaPlusPlayer.app".
packages:
  # VLCKit (xcframework) – für rohe MPEG-TS (.ts), die AVPlayer nicht kann.
  # Import-Modulname: VLCKitSPM. Ohne dieses Paket baut die App weiter (AVKit-Fallback).
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: "3.6.0"
  # Sparkle: Auto-Updater (nur macOS), wie bei den anderen Mika+ Apps.
  # B09 · BUG-14: exakt gepinnt (aufgelöste Version seit v1.1). Package.resolved liegt in der
  # nicht versionierten .xcodeproj – ohne Pin löste ein frischer Klon die neueste 2.x auf.
  # Anheben nur bewusst: Version hier ändern, generate_appcast/sign_update derselben Version nutzen.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.3"

targetTemplates:
  AppBase:
    type: application
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: MikaPlusPlayer
        PRODUCT_BUNDLE_IDENTIFIER: lu.daumedia.MikaPlusPlayer
        # B09 · OF-06: das nächste Release (Übergangs-Release für BF-01) heißt 1.2.
        MARKETING_VERSION: "1.2"
        # B09 · BUG-04: Build-Nummer (CFBundleVersion) – Sparkle vergleicht NUR diese.
        # Muss bei jedem Release über der höchsten sparkle:version in appcast.xml liegen
        # (v1.1 = 2); scripts/b09_release_check.sh bricht sonst ab.
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Resources/Info.plist
        SWIFT_VERSION: "5.10"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # B09 · Entwurf Entscheidung 8: Vorgabe für Sparkles automatische Prüfung (Info.plist SUEnableAutomaticChecks).
        # Release prüft automatisch; der macOS-Debug-Build überschreibt mit NO. Wirkt nur dort, wo Sparkle läuft.
        MIKA_SPARKLE_AUTOMATIC_CHECKS: "YES"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  # ---- iOS ----
  MikaPlusPlayer:
    templates: [AppBase]
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        # iOS: Automatic. Simulator läuft ohne Team; fürs echte Gerät in Xcode
        # unter "Signing & Capabilities" dein Team wählen.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "CWJM4J4HFN"
    dependencies:
      - package: VLCKitSPM
        product: VLCKitSPM

  # ---- macOS (mit Sparkle-Updater, für DMG-Distribution) ----
  MikaPlusPlayer-macOS:
    templates: [AppBase]
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        # Debug: "Sign to Run Locally" (ad hoc) -> lokal ohne Zertifikat lauffähig.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: "CWJM4J4HFN"
        # Sandbox ist in den Entitlements deaktiviert (DMG-Distribution + Sparkle).
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/MikaPlusPlayer.entitlements
      configs:
        Debug:
          # B09 · BF-119 / OF-10: eigene Bundle-ID für Debug-Build und Test-Host. Datenbank, Einstellungen,
          # Sparkle-Zustand und Schlüsselbund-Einträge der installierten App bleiben unberührt. Nur am macOS-Target
          # (nicht im Template), damit iOS unverändert bleibt; Release behält lu.daumedia.MikaPlusPlayer.
          PRODUCT_BUNDLE_IDENTIFIER: lu.daumedia.MikaPlusPlayer.debug
          # B09 · Entwurf Entscheidung 8: Debug prüft nicht planmäßig gegen den echten Feed.
          MIKA_SPARKLE_AUTOMATIC_CHECKS: "NO"
        Release:
          # B09 · BUG-02: Release mit Hardened Runtime und ohne Debug-Berechtigung.
          # Ohne CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO bettet Xcode get-task-allow=true ein
          # (jeder Nutzerprozess könnte sich anhängen und den Speicher lesen).
          # Debug bleibt unverändert (Debugger, Test-Host).
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # B09 · BF-03: Release mit Developer ID (Team CWJM4J4HFN); verteilt wird über Archivieren und Exportieren
          # (scripts/ExportOptions-DeveloperID.plist, scripts/release.sh). Debug und Test-Bundle bleiben ad hoc.
          CODE_SIGN_IDENTITY: "Developer ID Application"
    dependencies:
      - package: VLCKitSPM
        product: VLCKitSPM
      - package: Sparkle
        product: Sparkle

  # ---- Unit-Tests (macOS, gehostet von der Mac-App) ----
  MikaPlusPlayerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: MikaPlusPlayer-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: lu.daumedia.MikaPlusPlayerTests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: "CWJM4J4HFN"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MikaPlusPlayer.app/Contents/MacOS/MikaPlusPlayer
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  # iOS-Schema (iPhone/iPad/Simulator)
  MikaPlusPlayer:
    build:
      targets:
        MikaPlusPlayer: all
  # macOS-Schema (My Mac) inkl. Tests
  MikaPlusPlayer-macOS:
    build:
      targets:
        MikaPlusPlayer-macOS: all
        MikaPlusPlayerTests: [test]
    test:
      targets:
        - MikaPlusPlayerTests
      # B09 · BF-119: Der Test-Host speichert keinen wiederherstellbaren Fensterzustand (AppKit, für automatisierte
      # Tests dokumentiert) und ist über eine eigene Umgebungsmarke erkennbar. Hinweis: Mit eigenen Argumenten
      # übernimmt die Testaktion keine Argumente der Run-Aktion mehr; TEST_RUNNER_…-Variablen von xcodebuild bleiben.
      commandLineArguments:
        "-ApplePersistenceIgnoreState YES": true
      environmentVariables:
        MIKA_TEST_HOST: "1"
